name: Publish NuGet

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag to publish
        required: true
        type: string

permissions:
  contents: read

jobs:
  publish:
    name: Publish NuGet package
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout release tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          ref: ${{ inputs.tag }}

      - name: Set up .NET
        uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1 # v5
        with:
          global-json-file: global.json

      - name: Verify tag version
        env:
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          release_version="$(tr -d '[:space:]' < version)"
          test "$RELEASE_TAG" = "v$release_version"
          echo "RELEASE_VERSION=$release_version" >> "$GITHUB_ENV"

      - name: Restore
        run: dotnet restore HooSharper.slnx

      - name: Build
        run: dotnet build HooSharper.slnx -c Release --no-restore

      - name: Test
        run: dotnet test HooSharper.slnx -c Release --no-build

      - name: Pack
        run: dotnet pack src/HooSharper.Analyzers/HooSharper.Analyzers.csproj -c Release --no-build -o artifacts

      - name: Verify package version
        run: test -f "artifacts/HooSharper.Analyzers.${RELEASE_VERSION}.nupkg"

      - name: Log in to nuget.org
        id: nuget-login
        uses: NuGet/login@8d196754b4036150537f80ac539e15c2f1028841 # v1
        with:
          user: OpenHoo

      - name: Publish to nuget.org
        run: >-
          dotnet nuget push artifacts/*.nupkg
          --api-key "${{ steps.nuget-login.outputs.NUGET_API_KEY }}"
          --source https://api.nuget.org/v3/index.json
          --skip-duplicate
