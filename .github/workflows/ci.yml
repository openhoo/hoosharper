name: CI

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      publish_tag:
        description: Existing release tag to publish to nuget.org
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  BUN_VERSION: 1.3.14
  HOOVERSION_VERSION: 1.0.3

jobs:
  commitlint:
    name: Conventional Commits
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - name: Install Commitlint
        run: bun install --frozen-lockfile

      - name: Verify README package version
        run: bun run check-readme-version

      - name: Lint commits
        uses: openhoo/hooversion/actions/lint@4aa43b4d775c7b03d196b06381013f4601467c57 # v1.0.3
        with:
          version: ${{ env.HOOVERSION_VERSION }}

  build:
    name: Build and test
    needs: commitlint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up .NET
        uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1 # v5
        with:
          global-json-file: global.json

      - name: Restore
        run: dotnet restore tests/HooSharper.Analyzers.Tests/HooSharper.Analyzers.Tests.csproj

      - name: Build
        run: dotnet build tests/HooSharper.Analyzers.Tests/HooSharper.Analyzers.Tests.csproj -c Release --no-restore

      - name: Test with coverage
        run: >-
          dotnet test tests/HooSharper.Analyzers.Tests/HooSharper.Analyzers.Tests.csproj
          -c Release
          --no-build
          --collect:"XPlat Code Coverage"
          --results-directory TestResults
          --
          DataCollectionRunSettings.DataCollectors.DataCollector.Configuration.Format=cobertura

      - name: Enforce line coverage
        env:
          COVERAGE_THRESHOLD: "91"
        run: |
          set -euo pipefail
          coverage_file="$(find TestResults -type f -name coverage.cobertura.xml -print -quit)"
          test -n "$coverage_file"
          line_rate="$(sed -n 's/^[[:space:]]*<coverage line-rate="\([^"]*\)".*/\1/p' "$coverage_file")"
          test -n "$line_rate"
          awk -v rate="$line_rate" -v threshold="$COVERAGE_THRESHOLD" 'BEGIN {
            actual = rate * 100
            printf "Line coverage: %.2f%% (required: %.2f%%)\n", actual, threshold
            if (actual < threshold) exit 1
          }'

      - name: Pack
        run: dotnet pack src/HooSharper.Analyzers/HooSharper.Analyzers.csproj -c Release --no-build -o artifacts

      - name: Upload package
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: HooSharper.Analyzers
          path: artifacts/*.nupkg
          if-no-files-found: error


  publish-nuget:
    name: Publish NuGet package
    if: github.event_name == 'workflow_dispatch' && inputs.publish_tag != ''
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout release tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          ref: ${{ inputs.publish_tag }}

      - name: Set up .NET
        uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1 # v5
        with:
          global-json-file: global.json

      - name: Verify tag version
        env:
          RELEASE_TAG: ${{ inputs.publish_tag }}
        run: |
          set -euo pipefail
          release_version="$(tr -d '[:space:]' < version)"
          test "$RELEASE_TAG" = "v$release_version"
          echo "RELEASE_VERSION=$release_version" >> "$GITHUB_ENV"

      - name: Restore
        run: dotnet restore tests/HooSharper.Analyzers.Tests/HooSharper.Analyzers.Tests.csproj

      - name: Build
        run: dotnet build tests/HooSharper.Analyzers.Tests/HooSharper.Analyzers.Tests.csproj -c Release --no-restore

      - name: Test
        run: dotnet test tests/HooSharper.Analyzers.Tests/HooSharper.Analyzers.Tests.csproj -c Release --no-build

      - name: Pack
        run: dotnet pack src/HooSharper.Analyzers/HooSharper.Analyzers.csproj -c Release --no-build -o artifacts

      - name: Verify package version
        run: test -f "artifacts/HooSharper.Analyzers.${RELEASE_VERSION}.nupkg"

      - name: Log in to nuget.org
        id: nuget-login
        uses: NuGet/login@8d196754b4036150537f80ac539e15c2f1028841 # v1
        with:
          user: OpenHoo

      - name: Publish to nuget.org
        run: >-
          dotnet nuget push artifacts/*.nupkg
          --api-key "${{ steps.nuget-login.outputs.NUGET_API_KEY }}"
          --source https://api.nuget.org/v3/index.json
          --skip-duplicate

      - name: Relist package
        env:
          NUGET_API_KEY: ${{ steps.nuget-login.outputs.NUGET_API_KEY }}
        run: |
          curl --fail-with-body --silent --show-error \
            --request POST \
            --header "Content-Length: 0" \
            --header "X-NuGet-ApiKey: $NUGET_API_KEY" \
            "https://www.nuget.org/api/v2/package/HooSharper.Analyzers/${RELEASE_VERSION}"

  policy:
    name: Hoostack policy
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Enforce Hoolicy policy
        uses: openhoo/hoolicy/actions/check@584ed5abf673dfb9b1d5279dfaa78329a94a9ea5 # v0.2.3
        with:
          version: 0.2.3

      - name: Scan with Hooray
        uses: openhoo/hooray/actions/scan@d06c0948b4747995e2ef755cb6260d07f75c1b14 # v0.6.2
        with:
          version: 0.6.2
          policy: hooray-policy.yaml
          format: table
          output: ""

      - name: Analyze with Hoonarqube
        uses: openhoo/hoonarqube/actions/analyze@79e847af3edebc70685aaf90d3db7cdfcb557e97 # v0.2.2
        with:
          version: 0.2.2
          paths: |
            src
            tests
            benchmarks
          output: ${{ runner.temp }}/hoonarqube.json
          fail-on: none
