name: CI

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      publish_tag:
        description: Existing release tag to publish to nuget.org
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  BUN_VERSION: 1.3.14
  HOOVERSION_VERSION: 1.1.1

jobs:
  commitlint:
    name: Conventional Commits
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - name: Install Commitlint
        run: bun install --frozen-lockfile

      - name: Verify README package version
        run: bun run check-readme-version

      - name: Lint commits
        uses: openhoo/hooversion/actions/lint@ac503b23b9b36ebbf39ee6103713c81f1f18b64d # v1.1.1
        with:
          version: ${{ env.HOOVERSION_VERSION }}

  build:
    name: Build and test
    needs: commitlint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json

      - name: Restore
        run: dotnet restore tests/HooSharper.Analyzers.Tests/HooSharper.Analyzers.Tests.csproj

      - name: Build
        run: dotnet build tests/HooSharper.Analyzers.Tests/HooSharper.Analyzers.Tests.csproj -c Release --no-restore

      - name: Test with coverage
        run: >-
          dotnet test tests/HooSharper.Analyzers.Tests/HooSharper.Analyzers.Tests.csproj
          -c Release
          --no-build
          --collect:"XPlat Code Coverage"
          --results-directory TestResults
          --
          DataCollectionRunSettings.DataCollectors.DataCollector.Configuration.Format=cobertura

      - name: Enforce line coverage
        env:
          COVERAGE_THRESHOLD: "91"
        run: |
          set -euo pipefail
          coverage_file="$(find TestResults -type f -name coverage.cobertura.xml -print -quit)"
          test -n "$coverage_file"
          line_rate="$(sed -n 's/^[[:space:]]*<coverage line-rate="\([^"]*\)".*/\1/p' "$coverage_file")"
          test -n "$line_rate"
          awk -v rate="$line_rate" -v threshold="$COVERAGE_THRESHOLD" 'BEGIN {
            actual = rate * 100
            printf "Line coverage: %.2f%% (required: %.2f%%)\n", actual, threshold
            if (actual < threshold) exit 1
          }'

      - name: Pack
        run: dotnet pack src/HooSharper.Analyzers/HooSharper.Analyzers.csproj -c Release --no-build -o artifacts

      - name: Upload package
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: HooSharper.Analyzers
          path: artifacts/*.nupkg
          if-no-files-found: error


  publish-nuget:
    name: Publish NuGet package
    if: github.event_name == 'workflow_dispatch' && inputs.publish_tag != ''
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout release tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          ref: ${{ inputs.publish_tag }}

      - name: Set up .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json

      - name: Verify tag version
        env:
          RELEASE_TAG: ${{ inputs.publish_tag }}
        run: |
          set -euo pipefail
          release_version="$(tr -d '[:space:]' < version)"
          test "$RELEASE_TAG" = "v$release_version"
          echo "RELEASE_VERSION=$release_version" >> "$GITHUB_ENV"

      - name: Download signed GitHub Release package
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.publish_tag }}
        run: |
          set -euo pipefail
          package="HooSharper.Analyzers.${RELEASE_VERSION}.nupkg"
          mkdir -p artifacts
          gh release download "$RELEASE_TAG" \
            --pattern "$package" \
            --pattern SHA256SUMS \
            --dir artifacts
          expected="$(awk -v file="$package" '$2 == file { print $1 }' artifacts/SHA256SUMS)"
          test "${#expected}" -eq 64
          actual="$(sha256sum "artifacts/$package" | awk '{ print $1 }')"
          test "$actual" = "$expected"

      - name: Log in to nuget.org
        id: nuget-login
        uses: NuGet/login@8d196754b4036150537f80ac539e15c2f1028841 # v1.2.0
        with:
          user: OpenHoo

      - name: Publish to nuget.org
        run: >-
          dotnet nuget push "artifacts/HooSharper.Analyzers.${RELEASE_VERSION}.nupkg"
          --api-key "${{ steps.nuget-login.outputs.NUGET_API_KEY }}"
          --source https://api.nuget.org/v3/index.json
          --skip-duplicate

      - name: Relist package
        env:
          NUGET_API_KEY: ${{ steps.nuget-login.outputs.NUGET_API_KEY }}
        run: |
          curl --fail-with-body --silent --show-error \
            --request POST \
            --header "Content-Length: 0" \
            --header "X-NuGet-ApiKey: $NUGET_API_KEY" \
            "https://www.nuget.org/api/v2/package/HooSharper.Analyzers/${RELEASE_VERSION}"

  policy:
    name: Hoostack policy
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Enforce Hoolicy policy
        uses: openhoo/hoolicy/actions/check@46529a99335938e7284f11099bf15f7e1800e6f5 # v0.3.1
        with:
          version: 0.3.1

      - name: Scan with Hooray
        uses: openhoo/hooray/actions/scan@f2b28d71398749142f4d9366b0427369f3af6e02 # v0.6.5
        with:
          version: 0.6.5
          policy: hooray-policy.yaml
          format: table
          output: ""

      - name: Analyze with Hoonarqube
        uses: openhoo/hoonarqube/actions/analyze@11e4d2d44f5e34d11a7c03e4a87eea857ceea8ed # v0.3.0
        with:
          version: 0.3.0
          paths: |
            src
            tests
            benchmarks
          output: ${{ runner.temp }}/hoonarqube.json
          fail-on: none

      - name: Set up HooNeedsUpdates
        uses: openhoo/hooneedsupdates/actions/setup@ffd31b013dafcd772bb067a0eec76f739ecd76a3 # v0.3.1
        with:
          version: 0.3.1

      - name: Audit dependency freshness
        run: hooneedsupdates scan --fail-on unresolved .
        env:
          GITHUB_TOKEN: ${{ github.token }}
