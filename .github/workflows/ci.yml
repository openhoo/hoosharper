name: CI

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      publish_tag:
        description: Existing release tag to publish to nuget.org
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  BUN_VERSION: 1.3.14
  HOOVERSION_SHA: 799ecf4a9c29e8ce4d5ad7055a6030adf665cf82 # v0.2.0

jobs:
  commitlint:
    name: Conventional Commits
    if: github.event_name != 'workflow_dispatch' && (github.event_name != 'push' || !startsWith(github.event.head_commit.message, 'chore(release):'))
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - name: Install Commitlint
        run: bun install --frozen-lockfile

      - name: Verify README package version
        run: bun run check-readme-version

      - name: Run Commitlint
        env:
          FROM_SHA: ${{ github.event.pull_request.base.sha }}
          TO_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            bunx --no-install commitlint --from "$FROM_SHA" --to "$TO_SHA" --verbose
          else
            bunx --no-install commitlint --last --verbose
          fi

      - name: Install Hooversion
        run: |
          set -euo pipefail
          install_dir="$(mktemp -d "$RUNNER_TEMP/hooversion.XXXXXXXX")"
          echo "HOOVERSION_DIR=$install_dir" >> "$GITHUB_ENV"
          git init "$install_dir"
          git -C "$install_dir" fetch --depth 1 https://github.com/openhoo/hooversion.git "$HOOVERSION_SHA"
          git -C "$install_dir" checkout --detach FETCH_HEAD
          test "$(git -C "$install_dir" rev-parse HEAD)" = "$HOOVERSION_SHA"
          cd "$install_dir"
          bun install --frozen-lockfile

      - name: Lint commits
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            bun "$HOOVERSION_DIR/src/cli.ts" lint \
              --from "${{ github.event.pull_request.base.sha }}" \
              --to "${{ github.event.pull_request.head.sha }}"
          else
            bun "$HOOVERSION_DIR/src/cli.ts" lint --last
          fi

      - name: Remove Hooversion checkout
        if: always()
        run: test -z "${HOOVERSION_DIR:-}" || rm -rf "$HOOVERSION_DIR"

  build:
    name: Build and test
    needs: commitlint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up .NET
        uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1 # v5
        with:
          global-json-file: global.json

      - name: Restore
        run: dotnet restore tests/HooSharper.Analyzers.Tests/HooSharper.Analyzers.Tests.csproj

      - name: Build
        run: dotnet build tests/HooSharper.Analyzers.Tests/HooSharper.Analyzers.Tests.csproj -c Release --no-restore

      - name: Test with coverage
        run: >-
          dotnet test tests/HooSharper.Analyzers.Tests/HooSharper.Analyzers.Tests.csproj
          -c Release
          --no-build
          --collect:"XPlat Code Coverage"
          --results-directory TestResults
          --
          DataCollectionRunSettings.DataCollectors.DataCollector.Configuration.Format=cobertura

      - name: Enforce line coverage
        env:
          COVERAGE_THRESHOLD: "91"
        run: |
          set -euo pipefail
          coverage_file="$(find TestResults -type f -name coverage.cobertura.xml -print -quit)"
          test -n "$coverage_file"
          line_rate="$(sed -n 's/^[[:space:]]*<coverage line-rate="\([^"]*\)".*/\1/p' "$coverage_file")"
          test -n "$line_rate"
          awk -v rate="$line_rate" -v threshold="$COVERAGE_THRESHOLD" 'BEGIN {
            actual = rate * 100
            printf "Line coverage: %.2f%% (required: %.2f%%)\n", actual, threshold
            if (actual < threshold) exit 1
          }'

      - name: Pack
        run: dotnet pack src/HooSharper.Analyzers/HooSharper.Analyzers.csproj -c Release --no-build -o artifacts

      - name: Upload package
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: HooSharper.Analyzers
          path: artifacts/*.nupkg
          if-no-files-found: error


  publish-nuget:
    name: Publish NuGet package
    if: github.event_name == 'workflow_dispatch' && inputs.publish_tag != ''
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout release tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          ref: ${{ inputs.publish_tag }}

      - name: Set up .NET
        uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1 # v5
        with:
          global-json-file: global.json

      - name: Verify tag version
        env:
          RELEASE_TAG: ${{ inputs.publish_tag }}
        run: |
          set -euo pipefail
          release_version="$(tr -d '[:space:]' < version)"
          test "$RELEASE_TAG" = "v$release_version"
          echo "RELEASE_VERSION=$release_version" >> "$GITHUB_ENV"

      - name: Restore
        run: dotnet restore tests/HooSharper.Analyzers.Tests/HooSharper.Analyzers.Tests.csproj

      - name: Build
        run: dotnet build tests/HooSharper.Analyzers.Tests/HooSharper.Analyzers.Tests.csproj -c Release --no-restore

      - name: Test
        run: dotnet test tests/HooSharper.Analyzers.Tests/HooSharper.Analyzers.Tests.csproj -c Release --no-build

      - name: Pack
        run: dotnet pack src/HooSharper.Analyzers/HooSharper.Analyzers.csproj -c Release --no-build -o artifacts

      - name: Verify package version
        run: test -f "artifacts/HooSharper.Analyzers.${RELEASE_VERSION}.nupkg"

      - name: Log in to nuget.org
        id: nuget-login
        uses: NuGet/login@8d196754b4036150537f80ac539e15c2f1028841 # v1
        with:
          user: OpenHoo

      - name: Publish to nuget.org
        run: >-
          dotnet nuget push artifacts/*.nupkg
          --api-key "${{ steps.nuget-login.outputs.NUGET_API_KEY }}"
          --source https://api.nuget.org/v3/index.json
          --skip-duplicate

      - name: Relist package
        env:
          NUGET_API_KEY: ${{ steps.nuget-login.outputs.NUGET_API_KEY }}
        run: |
          curl --fail-with-body --silent --show-error \
            --request POST \
            --header "Content-Length: 0" \
            --header "X-NuGet-ApiKey: $NUGET_API_KEY" \
            "https://www.nuget.org/api/v2/package/HooSharper.Analyzers/${RELEASE_VERSION}"
